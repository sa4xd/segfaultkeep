name: Segfault SSH Auto Session

on:
  workflow_dispatch:

jobs:
  ssh-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 必须！允许 action 推送 commit
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt
          key: apt-cache-${{ runner.os }}
          restore-keys: |
            apt-cache-

      - name: Install sshpass & ssh client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pexpect

      - name: Run SSH automation
        env:
          HOST: lsd.segfault.net
          USER: root
          PASSWORD: segfault
          SECRET: ${{ secrets.SECRETP }}
          KEEP_TIME: 30
        run: |
          python3 ssh_auto.py
# ─────────────── 自动 commit 当前日期保活 ───────────────
      - name: Create keep-alive commit
        run: |
          echo "# Keep-alive commit" >> keepalive.md 2>/dev/null || true
          echo "" >> keepalive.md
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> keepalive.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.md || true

      - name: Commit & Push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: keep-alive commit - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          file_pattern: keepalive.md
          skip_dirty_check: false
          skip_fetch: false
          branch: ${{ github.head_ref || github.ref_name }}
